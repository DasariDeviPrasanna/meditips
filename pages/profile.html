<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link rel="stylesheet"
href="../css/style.css">

<link rel="stylesheet"
href="../css/navbar.css">

</head>

<body>

<div class="profile-page">

    <div class="profile-header">

        <img
        id="profilePhoto"
        class="profile-image"
        src="https://ui-avatars.com/api/?name=User">

        <h2 id="profileName">

            User

        </h2>

        <p id="profileEmail">

            user@gmail.com

        </p>

    </div>

    <div class="profile-stats">

        <div class="profile-stat">

            <h2 id="totalScans">

                0

            </h2>

            <p>

                Total Scans

            </p>

        </div>

        <div class="profile-stat">

            <h2 id="totalChats">

                0

            </h2>

            <p>

                AI Chats

            </p>

        </div>

    </div>
<div class="settings">

<div class="section-title">

Health

</div>

<div class="setting-item">

✏️

<span>Edit Profile</span>

</div>

<div class="setting-item">

🌐

<span>Language</span>

</div>

<div class="setting-item">

🌙

<span>Dark Mode</span>

</div>

<div class="setting-item">

🔔

<span>Notifications</span>

</div>

<div class="setting-item">

🤖

<span>AI Preferences</span>

</div>

<div class="section-title">

Support

</div>

<div class="setting-item">

❤️

<span>About Meditips</span>

</div>

<div class="setting-item">

⭐

<span>Rate App</span>

</div>

<div class="setting-item">

📞

<span>Contact Us</span>

</div>

<div class="setting-item">

🔐

<span>Privacy Policy</span>

</div>

</div>
    

    <button
    id="logoutBtn"
    class="logout-btn">

        🚪 Logout

    </button>

</div>

<script type="module"
src="../js/profile.js"></script>

<script type="module"
src="../js/navbar.js"></script>

</body>

</html>
