<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

.profile{

max-width:420px;
margin:auto;
padding:20px;

}

.header{

display:flex;
justify-content:space-between;
align-items:center;

}

.avatar{

width:120px;
height:120px;

border-radius:50%;

display:block;
margin:25px auto;

border:5px solid #4f8cff;

object-fit:cover;

}

.name{

text-align:center;

font-size:24px;

font-weight:bold;

}

.email{

text-align:center;

color:gray;

margin-bottom:30px;

}

.item{

background:white;

padding:18px;

margin-bottom:12px;

border-radius:15px;

cursor:pointer;

font-size:17px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.logout{

background:#ff4d4f;

color:white;

text-align:center;

}

</style>

</head>

<body>

<div class="profile">

<div class="header">

<h2>

👤 Profile

</h2>

<a href="dashboard.html">

🏠

</a>

</div>

<img
id="photo"
class="avatar">

<div
id="name"
class="name">

Loading...

</div>

<div
id="email"
class="email">

Loading...

</div>

<div
class="item"
id="editProfile">

✏ Edit Profile

</div>

<div
class="item">

🌐 Language

</div>

<div
class="item">

🌙 Dark Mode

</div>

<div
class="item"
onclick="location.href='history.html'">

📜 Scan History

</div>

<div
class="item logout"
id="logoutBtn">

🚪 Logout

</div>

</div>

<script
type="module"
src="../js/profile.js">

</script>

<script
type="module"
src="../js/logout.js">

</script>

<script
type="module"
src="../js/protect.js">

</script>

</body>

</html>
