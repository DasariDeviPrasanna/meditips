<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile | Meditips</title>

<link rel="stylesheet"
href="../css/profile.css">

<link rel="stylesheet"
href="../css/navbar.css">
<link rel="stylesheet" href="../css/common.css">

</head>

<body>

<div class="profile-page">

    <div class="profile-header">

        <img
        id="profilePhoto"
        class="profile-image"
        src="https://ui-avatars.com/api/?name=User"
        alt="Profile">

        <h2 id="profileName">

            User

        </h2>

        <p id="profileEmail">

            user@gmail.com

        </p>

    </div>

    <div class="profile-stats">

        <div class="profile-stat">

            <h2 id="totalScans">0</h2>

            <p>Total Scans</p>

        </div>

        <div class="profile-stat">

            <h2 id="totalChats">0</h2>

            <p>AI Chats</p>

        </div>

    </div>

    <div class="settings-card">

        <h3>Health</h3>

        <div class="setting-item">

            <span>✏️ Edit Profile</span>

            <span>›</span>

        </div>

        <div class="setting-item">

            <span>🌐 Language</span>

            <span>›</span>

        </div>

        <div class="setting-item"
        onclick="window.location.href='favorites.html'">

            <span>❤️ Favorites</span>

            <span>›</span>

        </div>

        <div class="setting-item" id="darkModeBtn">

    🌙

    <span>Dark Mode</span>

</div>

        <div class="setting-item">

            <span>🔔 Notifications</span>

            <span>›</span>

        </div>

        <div class="setting-item">

            <span>🤖 AI Preferences</span>

            <span>›</span>

        </div>

    </div>

    <div class="settings-card">

        <h3>Support</h3>

        <div class="setting-item">

            <span>❤️ About Meditips</span>

            <span>›</span>

        </div>

        <div class="setting-item">

            <span>⭐ Rate App</span>

            <span>›</span>

        </div>

        <div class="setting-item">

            <span>📞 Contact Us</span>

            <span>›</span>

        </div>

        <div class="setting-item">

            <span>🔒 Privacy Policy</span>

            <span>›</span>

        </div>

    </div>

    <button
    id="logoutBtn"
    class="logout-btn">

        🚪 Logout

    </button>

</div>

<script
type="module"
src="../js/profile.js"></script>

<script
type="module"
src="../js/navbar.js"></script>

</body>

</html>
