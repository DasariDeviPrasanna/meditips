<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet"
href="../css/style.css">

<style>

body{

margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f4f8fb;
font-family:Arial,sans-serif;

}

.card{

width:360px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
text-align:center;

}

input{

width:100%;
padding:12px;
margin-top:15px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;

}

button{

width:100%;
padding:13px;
margin-top:20px;
border:none;
background:#2563eb;
color:white;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

a{

text-decoration:none;
display:block;
margin-top:20px;

}

</style>

</head>

<body>

<div class="card">

<h2>

Reset Password

</h2>

<p>

Enter your registered email.

</p>

<input
type="email"
id="email"
placeholder="Enter Email">

<button
id="resetBtn">

Send Reset Link

</button>

<a href="login.html">

Back to Login

</a>

</div>

<script
type="module"
src="../js/forgot-password.js"></script>

</body>

</html>
