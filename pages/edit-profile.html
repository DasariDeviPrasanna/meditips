<!DOCTYPE html>
<html>

<head>

<title>Edit Profile</title>

<link rel="stylesheet"
href="../css/common.css">

<link rel="stylesheet"
href="../css/edit-profile.css">

</head>

<body>

<div class="edit-page">

<a
class="back-btn"
href="profile.html">

← Back

</a>

<div class="edit-header">

<h1>

✏️ Edit Profile

</h1>

</div>

<div class="edit-card">

<img

id="editPhoto"

class="edit-photo"

src="https://ui-avatars.com/api/?name=User">

<input

type="file"

id="photoInput"

accept="image/*"

hidden>

<button

id="changePhotoBtn"

class="change-photo-btn">

📷 Change Photo

</button>

<label>

Full Name

</label>

<input

id="editName"

type="text">

<label>

Email

</label>

<input

id="editEmail"

readonly>

<button

id="saveProfileBtn"

class="save-btn">

💾 Save Changes

</button>

</div>

</div>

<script
type="module"
src="../js/edit-profile.js">

</script>

</body>

</html>
