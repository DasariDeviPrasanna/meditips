<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicine Result - Meditips</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>

<div class="result-container">
<div class="medicine-header">

    <div>

        <h1 id="medicineName"></h1>

        <p class="medicine-subtitle">

            AI Medicine Analysis

        </p>

    </div>

    <button id="favoriteBtn">

        ❤️

    </button>

</div>


  <div class="card">
    <h3>Uses</h3>
    <p id="uses"></p>
  </div>

  <div class="card">
    <h3>Telugu Explanation</h3>
    <p id="telugu"></p>
  </div>
<div class="card">

    <h3>⚠ Side Effects</h3>

    <p id="sideEffects">

        Loading...

    </p>

</div>

<div class="card">

    <h3>🥗 Diet Recommendation</h3>

    <p id="diet">

        Loading...

    </p>

</div>

<div class="card">

    <h3>⏰ Dosage</h3>

    <p id="dosage">

        Loading...

    </p>

</div>

<div class="card">

    <h3>🚫 Warnings</h3>

    <p id="warnings">

        Loading...

    </p>

</div>
<div class="ai-card">

    <h3>

        🤖 Need More Help?

    </h3>

    <p>

        Ask Meditips AI any question about this medicine.

    </p>

    <button id="askAiBtn">

        Open AI Assistant

    </button>

</div>
  

<script type="module" src="../js/result.js"></script>
<script type="module" src="../js/chatbot.js"></script>
<script
type="module"
src="../js/navbar.js">
</script>
</body>
</html>
