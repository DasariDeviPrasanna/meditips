<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meditips Dashboard</title>

<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/navbar.css">
<link rel="stylesheet" href="../css/common.css">

</head>

<body>
<div class="dashboard">

    <!-- Header -->

    <div class="top-bar">

        <div>

            <h1 id="welcomeText">

                👋 Good Evening

            </h1>

            <p>

                Your AI Health Companion

            </p>

        </div>

        <img
        id="userPhoto"
        class="profile-photo"
        src="https://ui-avatars.com/api/?name=User">

    </div>


    <!-- AI Search -->

    <div
    class="search-box"
    onclick="location.href='assistant.html'">

        <span>

            🔍

        </span>

        <p>

            Ask Meditips AI...

        </p>

    </div>


    <!-- Quick Scan -->

    <div
    class="scan-card"
    onclick="location.href='scan.html'">

        <div>

            <h2>

                📷 Scan Medicine

            </h2>

            <p>

                Scan medicine strips instantly using AI.

            </p>

        </div>

        <span>

            ➜

        </span>

    </div>


    <!-- Stats -->

    <h2 class="title">

        Activity

    </h2>

    <div class="stats">

        <div class="stat-card">

            <h1 id="scanCount">

                0

            </h1>

            <p>

                Scans

            </p>

        </div>

        <div class="stat-card">

            <h1 id="chatCount">

                0

            </h1>

            <p>

                AI Chats

            </p>

        </div>

    </div>


    <!-- Recent -->

    <h2 class="title">

        Recent Activity

    </h2>

    <div
    id="recentActivity"
    class="recent-card">

        Loading...

    </div>


    <!-- Tip -->

   <div
class="tip-card"
id="healthTip">

Loading today's health tip...

</div>

</div>

<script type="module"
src="../js/dashboard.js"></script>

<script type="module"
src="../js/navbar.js"></script>
<a href="scan.html" class="fab">

📷

</a>
</body>

</html>
