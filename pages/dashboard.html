<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meditips Dashboard</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/navbar.css">

</head>

<body>

<div class="dashboard">

    <!-- Header -->

    <div class="dashboard-header">

        <div>

            <h1>👋 Welcome</h1>

            <p>Your AI Health Companion</p>

        </div>

        <img
        id="userPhoto"
        class="profile-photo"
        src="https://ui-avatars.com/api/?name=User">

    </div>


    <!-- AI Search -->

    <div
    class="search-card"
    onclick="location.href='assistant.html'">

        <input
        type="text"
        placeholder="Ask Meditips AI anything..."
        readonly>

        <span>🤖</span>

    </div>


    <!-- Quick Scan -->

    <div
    class="scan-card"
    onclick="location.href='scan.html'">

        <h2>📷 Scan Medicine</h2>

        <p>

            Scan medicine strips instantly using AI.

        </p>

    </div>


    <!-- Statistics -->

    <h2 class="section-title">

        📊 Your Activity

    </h2>

    <div class="stats">

        <div class="stat-card">

            <h3 id="scanCount">

                0

            </h3>

            <p>

                Scans

            </p>

        </div>

        <div class="stat-card">

            <h3 id="chatCount">

                0

            </h3>

            <p>

                AI Chats

            </p>

        </div>

        

    </div>


    <!-- Recent -->

    <h2 class="section-title">

        🕒 Recent Activity

    </h2>

    <div id="recentActivity">

        <div class="activity">

            No recent activity

        </div>

    </div>


    <!-- Health Tip -->

    <h2 class="section-title">

        💡 Health Tip

    </h2>

    <div class="tip-card">

        Drink enough water 💧

        Staying hydrated helps your body absorb medicines effectively.

    </div>

</div>

<script type="module" src="../js/dashboard.js"></script>

<script type="module" src="../js/navbar.js"></script>

</body>

</html>
