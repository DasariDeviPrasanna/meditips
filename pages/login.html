<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Meditips</title>

<link rel="stylesheet" href="../css/common.css">

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f8fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    width:100%;
    display:flex;
    justify-content:center;
}

.login-card{

    width:360px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.logo{

    font-size:55px;

}
.logo-container{
    text-align:center;
    margin-bottom:30px;
}

.logo-container img{
    width:90px;
    height:90px;
}

h1{

    margin:10px 0;

}

p{

    color:#666;
    margin-bottom:25px;

}

.input-group{

    text-align:left;
    margin-bottom:15px;

}

.input-group label{

    display:block;
    margin-bottom:6px;
    font-weight:600;

}

.input-group input{

    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
    box-sizing:border-box;

}

.forgot{

    text-align:right;
    margin-bottom:20px;

}

.forgot a{

    text-decoration:none;
    color:#2563eb;
    font-size:14px;

}

.login-btn{

    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;

}

.divider{

    margin:20px 0;
    color:#888;
    position:relative;

}

.divider::before{

    content:"";
    position:absolute;
    width:40%;
    height:1px;
    background:#ddd;
    left:0;
    top:50%;

}

.divider::after{

    content:"";
    position:absolute;
    width:40%;
    height:1px;
    background:#ddd;
    right:0;
    top:50%;

}

.google-btn{

    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    background:white;
    cursor:pointer;
    font-size:15px;

}

.signup{

    margin-top:20px;

}

.signup a{

    text-decoration:none;
    color:#2563eb;
    font-weight:bold;

}

</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="logo-container">
    <img src="../assets/logo.png" alt="Meditips Logo">
    
</div>

<h1>Meditips</h1>

<p>
Know Your Medicines Instantly
</p>

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter email">

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password">

</div>

<div class="forgot">

<a href="forgot-password.html">

Forgot Password?

</a>

</div>

<button
class="login-btn"
id="loginBtn">

Login

</button>

<div class="divider">

OR

</div>

<button
class="google-btn"
id="googleLoginBtn">

Continue with Google

</button>

<div class="signup">

Don't have an account?

<a href="signup.html">

Sign Up

</a>

</div>

</div>

</div>

<script type="module"
src="../js/auth-check.js"></script>

<script type="module"
src="../js/login.js"></script>

<script type="module"
src="../js/auth.js"></script>

</body>
</html>
