<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>History | Meditips</title>

<link rel="stylesheet"
href="../css/common.css">

<link rel="stylesheet"
href="../css/history.css">

<link rel="stylesheet"
href="../css/navbar.css">

</head>

<body>

<div class="history-page">

    <!-- Header -->

    <div class="history-header">

        <h1>

            📜 History

        </h1>

        <p>

            View your medicine scan history and analytics.

        </p>

    </div>

    <!-- Analytics -->

    <div class="analytics-section">

        <h2>

            📊 Analytics

        </h2>

        <div class="analytics-grid">

            <div class="analytics-card">

                <h3 id="totalScans">

                    0

                </h3>

                <p>

                    📷 Total Scans

                </p>

            </div>

            <div class="analytics-card">

                <h3 id="totalChats">

                    0

                </h3>

                <p>

                    🤖 AI Chats

                </p>

            </div>

            <div class="analytics-card">

                <h3 id="mostMedicine">

                    -

                </h3>

                <p>

                    💊 Most Scanned

                </p>

            </div>

            <div class="analytics-card">

                <h3 id="lastScan">

                    -

                </h3>

                <p>

                    📅 Last Scan

                </p>

            </div>

        </div>

    </div>
    <div class="history-filters">

    <button class="filter-btn active" data-filter="all">

        All

    </button>

    <button class="filter-btn" data-filter="today">

        Today

    </button>

    <button class="filter-btn" data-filter="week">

        This Week

    </button>

</div>

    <!-- Recent Activity -->

    <h2 class="recent-title">

        🕒 Recent Activity

    </h2>

    <div id="historyList">

    </div>

</div>
<div class="empty-history">

    <h1>

        📭

    </h1>

    <h3>

        No Scan History

    </h3>

    <p>

        Your scanned medicines will appear here.

    </p>

</div>

<script
type="module"
src="../js/history.js"></script>

<script
type="module"
src="../js/protect.js"></script>

<script
type="module"
src="../js/navbar.js"></script>

</body>

</html>
