<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Meditips AI</title>

<link rel="stylesheet"
href="../css/style.css">

<style>

body{

margin:0;

font-family:Arial;

background:#f5f7fb;

}

.header{

background:#2563eb;

padding:25px;

color:white;

border-radius:0 0 25px 25px;

}

.header h2{

margin:0;

}

.chat{

padding:20px;

}

.message{

background:white;

padding:15px;

border-radius:15px;

margin-bottom:15px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

padding:15px;

background:white;

display:flex;

gap:10px;

box-shadow:0 -2px 10px rgba(0,0,0,.08);

}

.bottom input{

flex:1;

padding:12px;

border-radius:30px;

border:1px solid #ddd;

}

.bottom button{

border:none;

background:#2563eb;

color:white;

padding:12px 18px;

border-radius:50%;

cursor:pointer;

}

</style>

</head>

<body>

<div class="header">

<h2>

🤖 Meditips AI

</h2>

<p>

Ask anything about medicines

</p>

</div>

<div
class="chat"
id="chatBox">

<div class="message">

👋 Hello!

I'm your AI Health Assistant.

Ask me anything about medicines.

</div>

</div>

<div class="bottom">

<input
id="question"
placeholder="Ask about medicines...">

<button
id="sendBtn">

➤

</button>

</div>

<script
type="module"
src="../js/assistant.js">

</script>

</body>

</html>
