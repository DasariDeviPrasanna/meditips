<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Meditips AI</title>

<link rel="stylesheet"
href="../css/assistant.css">
<link rel="stylesheet"
href="../css/navbar.css">
<link rel="stylesheet" href="../css/common.css">

<style>

body{

margin:0;

font-family:Arial;

background:#f5f7fb;

}

.header{

background:#2563eb;

padding:25px;

color:white;

border-radius:0 0 25px 25px;

}

.header h2{

margin:0;

}

.chat{

padding:20px;

}

.message{

background:white;

padding:15px;

border-radius:15px;

margin-bottom:15px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

padding:15px;

background:white;

display:flex;

gap:10px;

box-shadow:0 -2px 10px rgba(0,0,0,.08);

}

.bottom input{

flex:1;

padding:12px;

border-radius:30px;

border:1px solid #ddd;

}

.bottom button{

border:none;

background:#2563eb;

color:white;

padding:12px 18px;

border-radius:50%;

cursor:pointer;

}

</style>

</head>
<body>

<div class="header">

    <div>

        <h2>🤖 Meditips AI</h2>

        <p>Your Personal AI Medicine Assistant</p>

    </div>

    <button id="newChatBtn">

        + New Chat

    </button>

</div>

<div id="chatBox" class="chat-box">

    <div class="ai-message">

        <div class="avatar">
            🤖
        </div>

        <div class="bubble">

            <strong>Meditips AI</strong>

            <br><br>

            Hi 👋

            Ask me anything about your scanned medicine.

        </div>

    </div>

</div>

<div class="suggestions">

    <button class="suggestion">
        What is this medicine used for?
    </button>

    <button class="suggestion">
        Side effects
    </button>

    <button class="suggestion">
        Can I take it after food?
    </button>

    <button class="suggestion">
        Any precautions?
    </button>

</div>

<div class="input-area">

    <input
        id="question"
        type="text"
        placeholder="Ask Meditips AI..." />

    <button id="sendBtn">

        ➤

    </button>

</div>

<script type="module"
src="../js/assistant.js"></script>
<script
type="module"
src="../js/navbar.js">
</script>

</body>


</html>
