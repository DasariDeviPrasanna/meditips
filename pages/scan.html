<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Scan Medicine | Meditips</title>

    <link rel="stylesheet"
        href="../css/scan.css">

    <link rel="stylesheet"
        href="../css/navbar.css">
    <link rel="stylesheet" href="../css/common.css">

</head>

<body>

<div class="scan-page">

    <!-- Header -->

    <div class="page-header">

        <h1>📷 Scan Medicine</h1>

        <p>
            Capture or upload a medicine strip and let AI identify it instantly.
        </p>

    </div>

    <!-- Preview -->

    <div class="preview-card">

        <img
            id="previewImage"
            src="../assets/upload.png"
            alt="Preview">

        <div class="preview-status">

            <span id="statusIcon">
                📷
            </span>

            <p id="imageStatus">
                No image selected
            </p>

        </div>

    </div>

    <!-- Hidden File Input -->

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        capture="environment"
        hidden>

    <!-- Camera & Gallery -->

    <div class="action-grid">

        <button
            class="action-card"
            id="cameraBtn"
            type="button">

            <div class="action-icon">
                📷
            </div>

            <h3>Camera</h3>

            <p>Take a new photo</p>

        </button>

        <button
            class="action-card"
            id="galleryBtn"
            type="button">

            <div class="action-icon">
                🖼
            </div>

            <h3>Gallery</h3>

            <p>Select from gallery</p>

        </button>

    </div>

    <!-- Scan -->

    <button
        id="scanBtn"
        class="scan-btn">

        🔍 Scan Medicine

    </button>

    <!-- Tips -->

    <div class="tips-card">

        <h3>

            💡 AI Scan Tips

        </h3>

        <div class="tip">

            💡 Use good lighting.

        </div>

        <div class="tip">

            📦 Capture the complete medicine strip.

        </div>

        <div class="tip">

            📸 Avoid blurry or tilted images.

        </div>

    </div>

</div>

<!-- Loading -->

<div
    id="loadingOverlay"
    class="loading-overlay">

    <div class="loader"></div>

    <h2 id="loadingText">

        Detecting Medicine...

    </h2>

</div>

<script
    type="module"
    src="../js/scan.js"></script>

<script
    type="module"
    src="../js/navbar.js"></script>

</body>

</html>
